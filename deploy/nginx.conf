# /etc/nginx/sites-available/memorize114  (setup.sh installs this)
# certbot adds the HTTPS (443) blocks and the http→https redirect.

server {
    listen 80;
    server_name memorize114.com;
    return 301 http://www.memorize114.com$request_uri;
}

server {
    listen 80;
    server_name www.memorize114.com;

    root /opt/memorize114/web/dist;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # The API (Node, port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Built JS/CSS have hashed names: cache for a year
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # Qurʾān data and font change rarely
    location /data/  { expires 7d; }
    location /fonts/ { expires 30d; }

    # Every other path is a page of the React app
    location / { try_files $uri /index.html; }
}
